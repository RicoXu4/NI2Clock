plugins {
    id 'com.android.application'
}

// Local credentials are deliberately excluded from version control.
def clockProperties = new Properties()
def clockPropertiesFile = rootProject.file('clock.properties')
if (clockPropertiesFile.exists()) {
    clockPropertiesFile.withInputStream { clockProperties.load(it) }
}
def configString = { key ->
    groovy.json.JsonOutput.toJson(clockProperties.getProperty(key, ''))
}

android {
    namespace 'com.example.clockapp'
    compileSdk 35
    buildToolsVersion '35.0.0'

    defaultConfig {
        applicationId 'com.example.clockapp'
        minSdk 18
        targetSdk 33
        versionCode 1
        versionName '1.0'
        vectorDrawables.useSupportLibrary = true

        buildConfigField 'String', 'WEATHER_API_KEY', configString('weather.apiKey')
        buildConfigField 'String', 'ZABBIX_URL', configString('zabbix.url')
        buildConfigField 'String', 'ZABBIX_TOKEN', configString('zabbix.token')
        buildConfigField 'String', 'CODEX_USAGE_URL', configString('codex.bridgeUrl')
        buildConfigField 'String', 'CODEX_USAGE_TOKEN', configString('codex.bridgeToken')
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    // This release retains support for the Android 4.3 dashboard device.
    implementation 'com.google.android.material:material:1.6.1'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
    testImplementation 'com.squareup.okhttp3:mockwebserver:3.14.9'
}
