apply plugin: 'com.android.application'

android {
    namespace 'com.example.clockapp'  // Add this line
    compileSdkVersion 33  // Updated to support newer Gradle

    defaultConfig {
        applicationId "com.example.clockapp"
        minSdkVersion 18
        targetSdkVersion 33  // Updated
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.txt'
        }
    }

    lintOptions {
        abortOnError false
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation 'androidx.appcompat:appcompat:1.3.0'
    implementation 'androidx.appcompat:appcompat:1.3.0'
}